name: Publicar versão

# Gera o instalador do Windows e publica a versão no repositório público
# walterretke/juggl-releases (o código fica privado aqui), com o latest.json
# que o Juggl consulta para se atualizar sozinho. Dispare criando uma tag v0.2.0
# (a versão do tauri.conf.json precisa ser a mesma) ou pelo botão "Run workflow".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - name: Conferir segredos
        shell: bash
        env:
          CHAVE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          falta=0
          if [ -z "$CHAVE" ]; then echo "::error::Falta o segredo TAURI_SIGNING_PRIVATE_KEY"; falta=1; fi
          if [ -z "$TOKEN" ]; then echo "::error::Falta o segredo RELEASES_TOKEN"; falta=1; fi
          if [ -n "$CHAVE" ] && ! printf '%s' "$CHAVE" | base64 -d 2>/dev/null | grep -q "secret key"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY não parece a chave do arquivo TAURI_SIGNING_PRIVATE_KEY.txt (cole o conteúdo inteiro, uma linha só)"; falta=1
          fi
          if [ -n "$TOKEN" ]; then
            codigo=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/walterretke/juggl-releases)
            if [ "$codigo" != "200" ]; then echo "::error::RELEASES_TOKEN não acessa walterretke/juggl-releases (HTTP $codigo). O repositório existe e o token foi criado para ele?"; falta=1; fi
          fi
          exit $falta

      - uses: tauri-apps/tauri-action@v0
        env:
          # Token com permissão de escrita em walterretke/juggl-releases.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Chave que assina as atualizações (Settings > Secrets and variables > Actions).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          owner: walterretke
          repo: juggl-releases
          tagName: v__VERSION__
          releaseName: Juggl __VERSION__
          releaseBody: Baixe o instalador .msi (ou o -setup.exe) abaixo. Quem já tem o Juggl recebe a atualização dentro do app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
