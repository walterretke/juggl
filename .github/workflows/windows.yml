name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      # Testes do Rust, incluindo guardar e ler o token no Credential Manager do Windows.
      - run: cargo test --lib
        working-directory: src-tauri

      # Build de conferência: sem assinar atualização (a chave só existe no workflow de versão).
      - run: npm run tauri build -- --config src-tauri/tauri.ci.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: juggl-windows
          path: |
            src-tauri/target/release/juggl.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
